version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: leavedesk-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: leavedesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leavedesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leavedesk-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: LeaveDesk
      APP_ENV: production
      DEBUG: "False"
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/leavedesk
      JWT_SECRET_KEY: leave-desk-super-secret-key-change-in-production-iqg-2026
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000","http://127.0.0.1:8000"]'
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
